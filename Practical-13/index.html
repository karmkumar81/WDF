<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Practical 13 - Asynchronous Fetch API CRUD | CHARUSAT</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="header-bar">
      <div>
        <h1>Asynchronous Student Management</h1>
        <p class="subtitle">Practical 13: PHP JSON API &bull; Fetch API &bull; No Page Reloads</p>
      </div>
      <div>
        <button id="btn-open-create" class="btn btn-primary">+ Add Student via AJAX</button>
      </div>
    </div>

    <!-- Toast Notification Message -->
    <div class="toast-container">
      <div id="toast" class="toast"></div>
    </div>

    <!-- Search Toolbar with Debounce -->
    <div class="toolbar">
      <input type="text" id="live-search" class="search-input" placeholder="Debounced search by name, email, or enrollment..." />
      <span id="record-count" style="color: var(--text-muted); font-size: 0.9rem;">Loading records...</span>
    </div>

    <!-- Live Data Table -->
    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Enrollment</th>
            <th>Name</th>
            <th>Email</th>
            <th>Mobile</th>
            <th>Department</th>
            <th>GPA</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="student-tbody">
          <tr><td colspan="9" style="text-align: center; padding: 2rem;">Loading data via Fetch API...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Create/Edit Modal Dialog -->
  <div id="student-modal" class="modal-overlay">
    <div class="modal-box">
      <h2 id="modal-title" style="color: var(--primary); margin-bottom: 1.25rem;">Add Student</h2>
      <form id="student-form">
        <input type="hidden" id="form-id" />

        <div class="form-group">
          <label for="form-name">Full Name *</label>
          <input type="text" id="form-name" class="form-control" required />
        </div>

        <div class="form-group">
          <label for="form-enrollment">Enrollment Number *</label>
          <input type="text" id="form-enrollment" class="form-control" placeholder="24IT001" required />
        </div>

        <div class="form-group">
          <label for="form-email">Email Address *</label>
          <input type="email" id="form-email" class="form-control" required />
        </div>

        <div class="form-group">
          <label for="form-mobile">Mobile Number *</label>
          <input type="tel" id="form-mobile" class="form-control" placeholder="10 digits starting with 6-9" required />
        </div>

        <div class="form-group">
          <label for="form-dept">Department *</label>
          <select id="form-dept" class="form-control" required>
            <option value="IT">IT (CSPIT)</option>
            <option value="CSE">CSE (CSPIT)</option>
            <option value="CE">CE (DEPSTAR)</option>
            <option value="AIML">AIML</option>
          </select>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.5rem;">
          <button type="button" id="btn-cancel" class="btn" style="background: #cbd5e1; color: #0f172a;">Cancel</button>
          <button type="submit" id="btn-save" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
